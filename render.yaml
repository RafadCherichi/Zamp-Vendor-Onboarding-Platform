version: "1"
services:
  - type: web
    name: zamp-vendor-onboarding
    runtime: docker
    repo: https://github.com/RafadCherichi/Zamp-Vendor-Onboarding-Platform.git
    branch: main
    region: singapore
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////tmp/vendor_onboarding.db
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_LOCAL_DIR
        value: /tmp/zamp-uploads
      - key: MAX_FILE_SIZE_BYTES
        value: "15728640"
